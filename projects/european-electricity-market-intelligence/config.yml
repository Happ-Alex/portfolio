project:
  timezone: UTC
  start: "2024-01-01"
  end: "2024-01-08"
  raw_dir: "data/raw"

entsoe:
  zones:
    - DE_LU
    - FR
    - BE
    - NL
    - PL
    - CZ
  borders:
    - [DE_LU, FR]
    - [DE_LU, NL]
    - [DE_LU, BE]
    - [DE_LU, PL]
    - [DE_LU, CZ]
    - [FR, BE]
    - [BE, NL]

jao:
  endpoints:
    max_exchanges: "https://publicationtool.jao.eu/core/api/core/maxExchanges/index"
    max_net_positions: "https://publicationtool.jao.eu/core/api/core/maxNetPos/index"
    final_computation: "https://publicationtool.jao.eu/core/api/core/finalComputation/index"
  request_timeout_seconds: 60
  sleep_between_requests_seconds: 0.15

open_meteo:
  url: "https://archive-api.open-meteo.com/v1/archive"
  hourly:
    - temperature_2m
    - wind_speed_100m
    - shortwave_radiation
    - cloud_cover
  locations:
    DE_LU:
      name: Berlin
      latitude: 52.5200
      longitude: 13.4050
    FR:
      name: Paris
      latitude: 48.8566
      longitude: 2.3522
    BE:
      name: Brussels
      latitude: 50.8503
      longitude: 4.3517
    NL:
      name: Amsterdam
      latitude: 52.3676
      longitude: 4.9041
    PL:
      name: Warsaw
      latitude: 52.2297
      longitude: 21.0122
    CZ:
